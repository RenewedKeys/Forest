# Builds Forest from the exact source commit that was security-reviewed
# (d1e0178 of github.com/suspiciousman3187/Forest), with these removed:
# the auto-updater, the diagnostics upload, and the developer folder override.
# The changes are in .github/forest-hardening.patch in this repo.
# Run it from the Actions tab -> "Build Forest (reviewed)" -> Run workflow.
# The finished zip appears under "Artifacts" at the bottom of the run page.

name: Build Forest (reviewed)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/suspiciousman3187/Forest.git
  COMMIT: d1e017820a294c73d2b54991f12f763bb4e3c9ec
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the patch from this repo
        uses: actions/checkout@v4
        with:
          path: fork
          sparse-checkout: .github

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the reviewed commit and verify it
        shell: bash
        run: |
          set -euo pipefail
          mkdir src && cd src
          git init -q .
          git config core.autocrlf false
          git remote add origin "$UPSTREAM"
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then echo "Commit mismatch: $head"; exit 1; fi
          echo "Source is exactly commit $head"

      - name: Remove the updater, diagnostics upload and folder override
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          # strip any CRLF the Windows checkout may add, so the patch applies exactly
          tr -d '\r' < ../fork/.github/forest-hardening.patch > ../hardening.patch
          git apply --whitespace=nowarn ../hardening.patch
          test ! -e ui/Core/DesktopUpdater.cs
          test ! -e ui/Core/DiagnosticsUploader.cs
          if grep -q HttpClient ui/Core/UpdateManager.cs; then echo "updater still present"; exit 1; fi
          if grep -rq "gnosis-xi.com" ui; then echo "upload endpoint still present"; exit 1; fi
          if grep -q "TreesVersionsMatch" ui/Core/Config.cs; then echo "folder override still present"; exit 1; fi
          echo "Removals applied"

      - name: Build Trees.dll and waitinject.exe (32-bit)
        shell: pwsh
        working-directory: src/trees
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "Visual C++ tools not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars32.bat'
          $bat = @"
          @echo off
          call "$vcvars" >nul || exit /b 1
          rc /nologo /fo Trees.res Trees.rc || exit /b 1
          cl /nologo /LD /O2 /MT /EHsc /W3 /DNDEBUG Trees.cpp Trees.res /Fe:Trees.dll /Fo:Trees.obj /link /SUBSYSTEM:WINDOWS || exit /b 1
          cl /nologo /O2 /MT /EHsc /W3 /DNDEBUG waitinject.cpp /Fe:waitinject.exe /Fo:waitinject.obj || exit /b 1
          del *.obj *.exp *.lib *.res >nul 2>nul
          exit /b 0
          "@
          Set-Content -Path build-native.bat -Value $bat -Encoding ASCII
          cmd /c build-native.bat
          if ($LASTEXITCODE -ne 0) { throw "native build failed" }
          if (-not (Test-Path Trees.dll) -or -not (Test-Path waitinject.exe)) { throw "native outputs missing" }

      - name: Build the web UI
        shell: pwsh
        working-directory: src/ui/webui
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "web UI build failed" }

      - name: Build Forest.exe
        shell: pwsh
        working-directory: src
        run: |
          dotnet publish ui/Forest.UI.csproj -c Release -o "$env:GITHUB_WORKSPACE/Forest-SelfBuilt" --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/Forest-SelfBuilt/Forest.exe")) { throw "Forest.exe missing" }

      - name: Record SHA-256 fingerprints
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/Forest-SelfBuilt"
          $files = @("$out/Forest.exe", "$out/Forest.dll", "src/trees/Trees.dll", "src/trees/waitinject.exe")
          $lines = @("Built from commit $env:COMMIT with the auto-updater, diagnostics upload and developer folder override removed.", "")
          foreach ($f in $files) { if (Test-Path $f) { $lines += ("{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash, (Split-Path $f -Leaf)) } }
          $lines | Tee-Object -FilePath "$out/BUILD-INFO.txt"
          $lines | ForEach-Object { "    $_" } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: Forest-SelfBuilt
          path: Forest-SelfBuilt
          if-no-files-found: error
