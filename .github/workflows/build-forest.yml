# Builds Forest from the exact source commit that was security-reviewed
# (d1e0178 of github.com/suspiciousman3187/Forest), with the auto-updater
# removed. Run it from the Actions tab -> "Build Forest (reviewed)" -> Run workflow.
# The finished zip appears under "Artifacts" at the bottom of the run page.

name: Build Forest (reviewed)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/suspiciousman3187/Forest.git
  COMMIT: d1e017820a294c73d2b54991f12f763bb4e3c9ec
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the reviewed commit and verify it
        shell: bash
        run: |
          set -euo pipefail
          mkdir src && cd src
          git init -q .
          git config core.autocrlf false
          git remote add origin "$UPSTREAM"
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then echo "Commit mismatch: $head"; exit 1; fi
          echo "Source is exactly commit $head"

      - name: Remove the auto-updater
        shell: bash
        working-directory: src
        run: |
