          diff --git a/ui/Core/UpdateManager.cs b/ui/Core/UpdateManager.cs
          index e2bc580..ec5a344 100644
          --- a/ui/Core/UpdateManager.cs
          +++ b/ui/Core/UpdateManager.cs
          @@ -10,9 +10,6 @@ namespace Forest;
           
